[project]
name = "ragnarok"
version = "0.1.0"
description = "Sovereign, always-on personal AI agent on a fully local Ollama stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragnarok = "ragnarok.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragnarok"]
