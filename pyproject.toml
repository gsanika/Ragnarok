[project]
name = "ragnarok"
version = "0.3.1"
description = "Sovereign, always-on personal AI agent on a fully local Ollama stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["numpy>=1.26"]

[project.scripts]
ragnarok = "ragnarok.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragnarok", "ragnarok.memory", "ragnarok.cloud"]

[tool.setuptools.package-data]
ragnarok = ["ui.html"]
